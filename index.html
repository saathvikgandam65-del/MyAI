<!DOCTYPE html>
<html>
<head>
    <title>My AI</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f5f5;
        }

        .header {
            background: #202123;
            color: white;
            padding: 18px;
            font-size: 22px;
            font-weight: bold;
        }

        .chat {
            height: calc(100vh - 140px);
            overflow-y: auto;
            padding: 20px;
            box-sizing: border-box;
        }

        .message {
            max-width: 700px;
            margin: 15px auto;
            padding: 14px 18px;
            border-radius: 12px;
            line-height: 1.5;
            white-space: pre-wrap;
        }

        .user {
            background: #d9fdd3;
        }

        .ai {
            background: white;
        }

        .input-area {
            position: fixed;
            bottom: 0;
            width: 100%;
            background: white;
            padding: 15px;
            box-sizing: border-box;
            display: flex;
            gap: 10px;
        }

        input {
            flex: 1;
            padding: 14px;
            border: 1px solid #ccc;
            border-radius: 10px;
            font-size: 16px;
        }

        button {
            padding: 14px 22px;
            border: none;
            border-radius: 10px;
            background: #202123;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }
    </style>
</head>

<body>

    <div class="header">
        My AI
    </div>

    <div class="chat" id="chat">
        <div class="message ai">
            Hello! How can I help you?
        </div>
    </div>

    <div class="input-area">
        <input
            id="message"
            type="text"
            placeholder="Message My AI..."
            autocomplete="off"
        >

        <button onclick="sendMessage()">Send</button>
    </div>

    <script>
        const input = document.getElementById("message");

        input.addEventListener("keydown", function(event) {
            if (event.key === "Enter") {
                event.preventDefault();
                sendMessage();
            }
        });

        async function sendMessage() {
            const message = input.value.trim();

            if (!message) {
                return;
            }

            const chat = document.getElementById("chat");

            chat.innerHTML += `
                <div class="message user">${message}</div>
            `;

            input.value = "";
            input.focus();

            chat.scrollTop = chat.scrollHeight;

            const thinking = document.createElement("div");
            thinking.className = "message ai";
            thinking.textContent = "Thinking...";
            thinking.id = "thinking";

            chat.appendChild(thinking);
            chat.scrollTop = chat.scrollHeight;

            try {
                const response = await fetch("/chat", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        message: message
                    })
                });

                const data = await response.json();

                thinking.remove();

                chat.innerHTML += `
                    <div class="message ai">${data.reply}</div>
                `;

            } catch (error) {
                thinking.textContent =
                    "Sorry, I couldn't connect to My AI.";
            }

            chat.scrollTop = chat.scrollHeight;
            input.focus();
        }
    </script>

</body>
</html>

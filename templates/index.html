<!DOCTYPE html>
<html>
<head>
    <title>My AI</title>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Inter, Arial, sans-serif;
            background: #f7f7f8;
            color: #202123;
        }

        /* HEADER */

        .header {
            height: 64px;
            background: #ffffff;
            border-bottom: 1px solid #e5e5e5;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 24px;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 20;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 20px;
            font-weight: 700;
        }

        .logo-icon {
            width: 36px;
            height: 36px;
            border-radius: 11px;
            background: linear-gradient(135deg, #111827, #4b5563);
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
        }

        .status {
            display: flex;
            align-items: center;
            gap: 7px;
            font-size: 13px;
            color: #666;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            background: #22c55e;
            border-radius: 50%;
        }

        /* HISTORY SIDEBAR */

        .history {
            position: fixed;
            top: 64px;
            left: 0;
            bottom: 0;
            width: 250px;
            background: white;
            border-right: 1px solid #e5e5e5;
            padding: 15px;
            z-index: 15;
            overflow-y: auto;
        }

        .new-chat {
            width: 100%;
            height: 42px;
            border: 1px solid #ddd;
            background: white;
            color: #222;
            border-radius: 10px;
            cursor: pointer;
            font-weight: 600;
            margin-bottom: 15px;
        }

        .new-chat:hover {
            background: #f1f1f1;
        }

        .history-title {
            font-size: 12px;
            color: #888;
            margin: 10px 5px;
            text-transform: uppercase;
        }

        .history-item {
            padding: 11px;
            border-radius: 9px;
            cursor: pointer;
            margin-bottom: 4px;
            font-size: 14px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .history-item:hover {
            background: #f1f1f1;
        }

        .history-item.active {
            background: #e9e9e9;
        }

        /* CHAT */

        .chat {
            margin-left: 250px;
            height: calc(100vh - 150px);
            overflow-y: auto;
            padding: 95px 20px 120px;
        }

        .welcome {
            max-width: 850px;
            margin: 80px auto 40px;
            text-align: center;
        }

        .welcome-icon {
            width: 70px;
            height: 70px;
            margin: auto;
            border-radius: 22px;
            background: linear-gradient(135deg, #111827, #6366f1);
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 30px;
            font-weight: bold;
            box-shadow: 0 10px 30px rgba(0,0,0,0.12);
        }

        .welcome h1 {
            margin: 22px 0 8px;
            font-size: 32px;
        }

        .welcome p {
            margin: 0;
            color: #777;
            font-size: 16px;
        }

        /* MESSAGES */

        .message {
            max-width: 850px;
            margin: 0 auto 18px;
            padding: 17px 20px;
            border-radius: 16px;
            line-height: 1.6;
            white-space: pre-wrap;
            animation: appear 0.2s ease;
        }

        @keyframes appear {
            from {
                opacity: 0;
                transform: translateY(5px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .user {
            background: #202123;
            color: white;
            border-bottom-right-radius: 5px;
        }

        .ai {
            background: white;
            border: 1px solid #e7e7e7;
            box-shadow: 0 2px 8px rgba(0,0,0,0.03);
            border-bottom-left-radius: 5px;
        }

        .typing {
            color: #777;
            font-style: italic;
        }

        /* INPUT */

        .input-area {
            position: fixed;
            bottom: 0;
            left: 250px;
            right: 0;
            padding: 18px 20px 22px;
            background: linear-gradient(
                to top,
                #f7f7f8 70%,
                rgba(247,247,248,0)
            );
            z-index: 10;
        }

        .input-box {
            max-width: 850px;
            margin: auto;
            background: white;
            border: 1px solid #d9d9d9;
            border-radius: 18px;
            padding: 7px;
            display: flex;
            gap: 8px;
            box-shadow: 0 8px 30px rgba(0,0,0,0.08);
        }

        input {
            flex: 1;
            border: none;
            outline: none;
            padding: 13px 15px;
            font-size: 16px;
            background: transparent;
            min-width: 0;
        }

        button {
            border: none;
            border-radius: 13px;
            background: #202123;
            color: white;
            padding: 0 22px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
        }

        button:hover {
            background: #000000;
            transform: translateY(-1px);
        }

        button:active {
            transform: scale(0.97);
        }

        .footer {
            text-align: center;
            color: #999;
            font-size: 11px;
            margin-top: 8px;
        }

        /* MOBILE MENU */

        .menu-button {
            display: none;
        }

        /* MOBILE */

        @media (max-width: 700px) {

            .header {
                height: 58px;
                padding: 0 14px;
            }

            .logo {
                font-size: 18px;
            }

            .logo-icon {
                width: 32px;
                height: 32px;
                border-radius: 9px;
            }

            .status {
                display: none;
            }

            .menu-button {
                display: block;
                background: transparent;
                color: #222;
                font-size: 24px;
                padding: 5px 10px;
            }

            .history {
                display: none;
                top: 58px;
                width: 85%;
                box-shadow: 5px 0 20px rgba(0,0,0,0.15);
            }

            .history.open {
                display: block;
            }

            .chat {
                margin-left: 0;
                width: 100%;
                height: calc(100vh - 135px);
                padding: 75px 10px 110px;
            }

            .welcome {
                margin-top: 55px;
                padding: 0 15px;
            }

            .welcome h1 {
                font-size: 25px;
            }

            .message {
                width: 100%;
                max-width: 100%;
                padding: 13px 14px;
                font-size: 16px;
            }

            .input-area {
                left: 0;
                padding: 8px 10px 10px;
            }

            .input-box {
                width: 100%;
                border-radius: 15px;
            }

            button {
                padding: 0 16px;
            }
        }
    </style>
</head>

<body>

    <!-- HEADER -->

    <div class="header">

        <button class="menu-button" onclick="toggleHistory()">
            ☰
        </button>

        <div class="logo">
            <div class="logo-icon">M</div>
            <span>My AI</span>
        </div>

        <div class="status">
            <div class="status-dot"></div>
            Online
        </div>

    </div>


    <!-- CHAT HISTORY -->

    <div class="history" id="history">

        <button class="new-chat" onclick="newChat()">
            + New Chat
        </button>

        <div class="history-title">
            Chat History
        </div>

        <div id="historyList"></div>

    </div>


    <!-- CHAT -->

    <div class="chat" id="chat">

        <div class="welcome">

            <div class="welcome-icon">
                M
            </div>

            <h1>How can I help you?</h1>

            <p>Ask me anything.</p>

        </div>

    </div>


    <!-- INPUT -->

    <div class="input-area">

        <div class="input-box">

            <input
                id="message"
                type="text"
                placeholder="Message My AI..."
                autocomplete="off"
            >

            <button onclick="sendMessage()">
                Send
            </button>

        </div>

        <div class="footer">
            My AI can make mistakes. Check important information.
        </div>

    </div>


    <script>

        const input = document.getElementById("message");
        const chat = document.getElementById("chat");
        const historyList = document.getElementById("historyList");

        let chats = JSON.parse(
            localStorage.getItem("myAI_chats") || "[]"
        );

        let currentChat = null;


        /* SAVE HISTORY */

        function saveChats() {

            localStorage.setItem(
                "myAI_chats",
                JSON.stringify(chats)
            );

        }


        /* CREATE NEW CHAT */

        function newChat() {

            currentChat = {
                id: Date.now(),
                title: "New Chat",
                messages: []
            };

            chats.unshift(currentChat);

            saveChats();
            renderHistory();
            renderChat();

        }


        /* SHOW HISTORY */

        function renderHistory() {

            historyList.innerHTML = "";

            chats.forEach(function(item) {

                const div = document.createElement("div");

                div.className = "history-item";

                if (
                    currentChat &&
                    item.id === currentChat.id
                ) {
                    div.classList.add("active");
                }

                div.textContent = item.title;

                div.onclick = function() {

                    currentChat = item;

                    renderHistory();
                    renderChat();

                    document
                        .getElementById("history")
                        .classList.remove("open");

                };

                historyList.appendChild(div);

            });

        }


        /* SHOW CURRENT CHAT */

        function renderChat() {

            chat.innerHTML = "";

            if (
                !currentChat ||
                currentChat.messages.length === 0
            ) {

                chat.innerHTML = `
                    <div class="welcome">

                        <div class="welcome-icon">
                            M
                        </div>

                        <h1>How can I help you?</h1>

                        <p>Ask me anything.</p>

                    </div>
                `;

                return;
            }


            currentChat.messages.forEach(function(message) {

                const div = document.createElement("div");

                div.className =
                    "message " + message.role;

                div.textContent = message.text;

                chat.appendChild(div);

            });

            chat.scrollTop = chat.scrollHeight;

        }


        /* SEND MESSAGE */

        async function sendMessage() {

            const message = input.value.trim();

            if (!message) {
                return;
            }


            if (!currentChat) {
                newChat();
            }


            currentChat.messages.push({
                role: "user",
                text: message
            });


            if (currentChat.title === "New Chat") {

                currentChat.title =
                    message.substring(0, 30);

            }


            input.value = "";

            input.focus();

            saveChats();
            renderHistory();
            renderChat();


            const thinking =
                document.createElement("div");

            thinking.className =
                "message ai typing";

            thinking.textContent =
                "My AI is thinking...";

            chat.appendChild(thinking);

            chat.scrollTop =
                chat.scrollHeight;


            try {

                const response = await fetch("/chat", {

                    method: "POST",

                    headers: {
                        "Content-Type": "application/json"
                    },

                    body: JSON.stringify({
                        message: message
                    })

                });


                const data =
                    await response.json();

                thinking.remove();


                currentChat.messages.push({

                    role: "ai",

                    text: data.reply

                });


                saveChats();

                renderChat();


            } catch (error) {

                thinking.textContent =
                    "Sorry, I couldn't connect to My AI.";

            }


            chat.scrollTop =
                chat.scrollHeight;

            input.focus();

        }


        /* ENTER KEY */

        input.addEventListener(
            "keydown",
            function(event) {

                if (event.key === "Enter") {

                    event.preventDefault();

                    sendMessage();

                }

            }
        );


        /* MOBILE HISTORY */

        function toggleHistory() {

            document
                .getElementById("history")
                .classList.toggle("open");

        }


        /* LOAD HISTORY */

        if (chats.length > 0) {

            currentChat = chats[0];

        } else {

            currentChat = {
                id: Date.now(),
                title: "New Chat",
                messages: []
            };

            chats.push(currentChat);

            saveChats();

        }


        renderHistory();
        renderChat();

    </script>

</body>
</html>

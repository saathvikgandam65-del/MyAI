<!DOCTYPE html>
<html>
<head>
    <title>My AI</title>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Inter, Arial, sans-serif;
            background: #f7f7f8;
            color: #202123;
        }

        /* TOP BAR */

        .header {
            height: 64px;
            background: #ffffff;
            border-bottom: 1px solid #e5e5e5;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 24px;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 10;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 20px;
            font-weight: 700;
        }

        .logo-icon {
            width: 36px;
            height: 36px;
            border-radius: 11px;
            background: linear-gradient(135deg, #111827, #4b5563);
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
        }

        .status {
            display: flex;
            align-items: center;
            gap: 7px;
            font-size: 13px;
            color: #666;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            background: #22c55e;
            border-radius: 50%;
        }

        /* CHAT */

        .chat {
            height: calc(100vh - 150px);
            overflow-y: auto;
            padding: 95px 20px 120px;
        }

        .welcome {
            max-width: 850px;
            margin: 80px auto 40px;
            text-align: center;
        }

        .welcome-icon {
            width: 70px;
            height: 70px;
            margin: auto;
            border-radius: 22px;
            background: linear-gradient(135deg, #111827, #6366f1);
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 30px;
            font-weight: bold;
            box-shadow: 0 10px 30px rgba(0,0,0,0.12);
        }

        .welcome h1 {
            margin: 22px 0 8px;
            font-size: 32px;
        }

        .welcome p {
            margin: 0;
            color: #777;
            font-size: 16px;
        }

        /* MESSAGES */

        .message {
            max-width: 850px;
            margin: 0 auto 18px;
            padding: 17px 20px;
            border-radius: 16px;
            line-height: 1.6;
            white-space: pre-wrap;
            animation: appear 0.2s ease;
        }

        @keyframes appear {
            from {
                opacity: 0;
                transform: translateY(5px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .user {
            background: #202123;
            color: white;
            border-bottom-right-radius: 5px;
        }

        .ai {
            background: white;
            border: 1px solid #e7e7e7;
            box-shadow: 0 2px 8px rgba(0,0,0,0.03);
            border-bottom-left-radius: 5px;
        }

        .typing {
            color: #777;
            font-style: italic;
        }

        /* INPUT */

        .input-area {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            padding: 18px 20px 22px;
            background: linear-gradient(
                to top,
                #f7f7f8 70%,
                rgba(247,247,248,0)
            );
        }

        .input-box {
            max-width: 850px;
            margin: auto;
            background: white;
            border: 1px solid #d9d9d9;
            border-radius: 18px;
            padding: 7px;
            display: flex;
            gap: 8px;
            box-shadow: 0 8px 30px rgba(0,0,0,0.08);
        }

        input {
            flex: 1;
            border: none;
            outline: none;
            padding: 13px 15px;
            font-size: 16px;
            background: transparent;
            min-width: 0;
        }

        button {
            border: none;
            border-radius: 13px;
            background: #202123;
            color: white;
            padding: 0 22px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
        }

        button:hover {
            background: #000000;
            transform: translateY(-1px);
        }

        button:active {
            transform: scale(0.97);
        }

        .footer {
            text-align: center;
            color: #999;
            font-size: 11px;
            margin-top: 8px;
        }

        /* MOBILE */

        @media (max-width: 600px) {

            .header {
                padding: 0 15px;
            }

            .logo {
                font-size: 18px;
            }

            .status {
                display: none;
            }

            .chat {
                padding: 85px 10px 120px;
            }

            .welcome {
                margin-top: 60px;
            }

            .welcome h1 {
                font-size: 27px;
            }

            .message {
                padding: 14px 15px;
                border-radius: 14px;
            }

            .input-area {
                padding: 10px;
            }

            .input-box {
                border-radius: 15px;
            }

            button {
                padding: 0 16px;
            }
        }
    </style>
</head>

<body>

    <!-- HEADER -->

    <div class="header">

        <div class="logo">
            <div class="logo-icon">M</div>
            <span>My AI</span>
        </div>

        <div class="status">
            <div class="status-dot"></div>
            Online
        </div>

    </div>


    <!-- CHAT -->

    <div class="chat" id="chat">

        <div class="welcome" id="welcome">

            <div class="welcome-icon">
                M
            </div>

            <h1>How can I help you?</h1>

            <p>Ask me anything.</p>

        </div>

    </div>


    <!-- INPUT -->

    <div class="input-area">

        <div class="input-box">

            <input
                id="message"
                type="text"
                placeholder="Message My AI..."
                autocomplete="off"
            >

            <button onclick="sendMessage()">
                Send
            </button>

        </div>

        <div class="footer">
            My AI can make mistakes. Check important information.
        </div>

    </div>


    <script>

        const input = document.getElementById("message");
        const chat = document.getElementById("chat");


        input.addEventListener("keydown", function(event) {

            if (event.key === "Enter") {

                event.preventDefault();

                sendMessage();

            }

        });


        async function sendMessage() {

            const message = input.value.trim();

            if (!message) {
                return;
            }


            const welcome = document.getElementById("welcome");

            if (welcome) {
                welcome.remove();
            }


            chat.innerHTML += `
                <div class="message user">
                    ${escapeHtml(message)}
                </div>
            `;


            input.value = "";

            input.focus();

            chat.scrollTop = chat.scrollHeight;


            const thinking = document.createElement("div");

            thinking.className = "message ai typing";

            thinking.textContent = "My AI is thinking...";

            chat.appendChild(thinking);

            chat.scrollTop = chat.scrollHeight;


            try {

                const response = await fetch("/chat", {

                    method: "POST",

                    headers: {
                        "Content-Type": "application/json"
                    },

                    body: JSON.stringify({
                        message: message
                    })

                });


                const data = await response.json();

                thinking.remove();


                const aiMessage = document.createElement("div");

                aiMessage.className = "message ai";

                aiMessage.textContent = data.reply;

                chat.appendChild(aiMessage);


            } catch (error) {

                thinking.textContent =
                    "Sorry, I couldn't connect to My AI.";

            }


            chat.scrollTop = chat.scrollHeight;

            input.focus();

        }


        function escapeHtml(text) {

            const div = document.createElement("div");

            div.textContent = text;

            return div.innerHTML;

        }

    </script>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>My AI</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #0b0d12;
    color: white;
    height: 100vh;
    overflow: hidden;
}

.app {
    display: flex;
    height: 100vh;
}

.sidebar {
    width: 250px;
    background: #11141b;
    border-right: 1px solid #252936;
    padding: 20px;
    display: flex;
    flex-direction: column;
}

.logo {
    font-size: 24px;
    font-weight: bold;
    margin-bottom: 25px;
}

.new-chat {
    width: 100%;
    padding: 12px;
    border: 0;
    border-radius: 10px;
    background: #ffffff;
    color: #111;
    font-weight: bold;
    cursor: pointer;
    margin-bottom: 15px;
}

.new-chat:hover {
    opacity: 0.85;
}

.sidebar-button {
    background: #191d26;
    border: 1px solid #292e3a;
    color: white;
    padding: 11px;
    border-radius: 9px;
    margin-bottom: 8px;
    cursor: pointer;
    text-align: left;
}

.sidebar-button:hover {
    background: #242936;
}

.main {
    flex: 1;
    display: flex;
    flex-direction: column;
    min-width: 0;
}

.topbar {
    height: 65px;
    border-bottom: 1px solid #252936;
    display: flex;
    align-items: center;
    padding: 0 20px;
    font-size: 18px;
    font-weight: bold;
}

.messages {
    flex: 1;
    overflow-y: auto;
    padding: 25px;
}

.welcome {
    max-width: 750px;
    margin: 60px auto;
    text-align: center;
}

.welcome h1 {
    font-size: 38px;
    margin-bottom: 10px;
}

.welcome p {
    color: #9ba1ae;
    font-size: 16px;
}

.message {
    max-width: 850px;
    margin: 0 auto 20px;
    padding: 15px 18px;
    border-radius: 14px;
    line-height: 1.5;
    white-space: pre-wrap;
}

.user-message {
    background: #1b202b;
}

.ai-message {
    background: #12161e;
    border: 1px solid #242936;
}

.media-message img {
    max-width: 100%;
    border-radius: 14px;
    margin-top: 10px;
}

.media-message video {
    max-width: 100%;
    border-radius: 14px;
    margin-top: 10px;
}

.modes {
    max-width: 900px;
    width: calc(100% - 30px);
    margin: 0 auto 10px;
    display: flex;
    gap: 7px;
    overflow-x: auto;
}

.mode {
    border: 1px solid #303542;
    background: #151922;
    color: #ddd;
    padding: 9px 12px;
    border-radius: 20px;
    cursor: pointer;
    white-space: nowrap;
}

.mode:hover {
    background: #252a35;
}

.mode.active {
    background: white;
    color: black;
}

.input-area {
    padding: 12px 15px 18px;
}

.input-box {
    max-width: 900px;
    margin: auto;
    background: #151922;
    border: 1px solid #303542;
    border-radius: 16px;
    padding: 8px;
    display: flex;
    align-items: center;
    gap: 7px;
}

#messageInput {
    flex: 1;
    background: transparent;
    color: white;
    border: 0;
    outline: none;
    font-size: 16px;
    padding: 10px;
    min-width: 0;
}

.icon-button {
    width: 42px;
    height: 42px;
    border: 0;
    border-radius: 11px;
    background: #242936;
    color: white;
    cursor: pointer;
    font-size: 18px;
}

.icon-button:hover {
    background: #333947;
}

.send-button {
    background: white;
    color: black;
    font-weight: bold;
}

#fileInput {
    display: none;
}

.file-name {
    max-width: 900px;
    margin: 5px auto;
    color: #9ba1ae;
    font-size: 13px;
}

.loading {
    display: inline-flex;
    gap: 5px;
}

.loading span {
    width: 7px;
    height: 7px;
    background: #aaa;
    border-radius: 50%;
    animation: bounce 1s infinite;
}

.loading span:nth-child(2) {
    animation-delay: .15s;
}

.loading span:nth-child(3) {
    animation-delay: .3s;
}

@keyframes bounce {
    0%, 100% {
        transform: translateY(0);
    }

    50% {
        transform: translateY(-5px);
    }
}

@media (max-width: 700px) {

    .sidebar {
        display: none;
    }

    .welcome {
        margin: 30px auto;
    }

    .welcome h1 {
        font-size: 30px;
    }

    .messages {
        padding: 15px;
    }

    .message {
        font-size: 15px;
    }

    .mode {
        font-size: 13px;
        padding: 8px 10px;
    }

    .input-box {
        border-radius: 14px;
    }
}
</style>
</head>

<body>

<div class="app">

    <aside class="sidebar">

        <div class="logo">
            🤖 My AI
        </div>

        <button class="new-chat" onclick="newChat()">
            ＋ New Chat
        </button>

        <button class="sidebar-button" onclick="selectMode('chat')">
            💬 Chat
        </button>

        <button class="sidebar-button" onclick="selectMode('image')">
            🖼️ Generate Image
        </button>

        <button class="sidebar-button" onclick="selectMode('edit')">
            📷 Edit Photo
        </button>

        <button class="sidebar-button" onclick="selectMode('video')">
            🎬 Generate Video
        </button>

        <button class="sidebar-button" onclick="selectMode('image-video')">
            🖼️➡️🎬 Image → Video
        </button>

    </aside>

    <main class="main">

        <div class="topbar">
            🤖 My AI
        </div>

        <section class="messages" id="messages">

            <div class="welcome" id="welcome">

                <h1>What can I help you create?</h1>

                <p>
                    Chat, create images, edit photos,
                    generate videos, and more.
                </p>

            </div>

        </section>

        <div class="modes">

            <button
                class="mode active"
                id="chatMode"
                onclick="selectMode('chat')">
                💬 Chat
            </button>

            <button
                class="mode"
                id="imageMode"
                onclick="selectMode('image')">
                🖼️ Image
            </button>

            <button
                class="mode"
                id="editMode"
                onclick="selectMode('edit')">
                📷 Edit Photo
            </button>

            <button
                class="mode"
                id="videoMode"
                onclick="selectMode('video')">
                🎬 Video
            </button>

            <button
                class="mode"
                id="imageVideoMode"
                onclick="selectMode('image-video')">
                🖼️➡️🎬
            </button>

        </div>

        <div class="file-name" id="fileName"></div>

        <div class="input-area">

            <div class="input-box">

                <input
                    type="file"
                    id="fileInput"
                    accept="image/*"
                    onchange="fileSelected()"
                >

                <button
                    class="icon-button"
                    title="Upload photo"
                    onclick="document.getElementById('fileInput').click()">
                    📎
                </button>

                <input
                    id="messageInput"
                    type="text"
                    placeholder="Message My AI..."
                    autocomplete="off"
                >

                <button
                    class="icon-button"
                    id="voiceButton"
                    title="Voice"
                    onclick="startVoice()">
                    🎤
                </button>

                <button
                    class="icon-button send-button"
                    onclick="sendMessage()">
                    ➤
                </button>

            </div>

        </div>

    </main>

</div>

<script>

let currentMode = "chat";
let selectedFile = null;
let currentRecorder = null;


/* =========================
   MODE
========================= */

function selectMode(mode) {

    currentMode = mode;

    document.querySelectorAll(".mode")
        .forEach(button => {
            button.classList.remove("active");
        });

    if (mode === "chat") {
        document.getElementById("chatMode")
            .classList.add("active");

        document.getElementById("messageInput")
            .placeholder = "Message My AI...";
    }

    if (mode === "image") {
        document.getElementById("imageMode")
            .classList.add("active");

        document.getElementById("messageInput")
            .placeholder =
                "Describe the image you want...";
    }

    if (mode === "edit") {
        document.getElementById("editMode")
            .classList.add("active");

        document.getElementById("messageInput")
            .placeholder =
                "Tell me how to edit the photo...";
    }

    if (mode === "video") {
        document.getElementById("videoMode")
            .classList.add("active");

        document.getElementById("messageInput")
            .placeholder =
                "Describe the video you want...";
    }

    if (mode === "image-video") {
        document.getElementById("imageVideoMode")
            .classList.add("active");

        document.getElementById("messageInput")
            .placeholder =
                "Describe how the image should move...";
    }
}


/* =========================
   FILE
========================= */

function fileSelected() {

    const input =
        document.getElementById("fileInput");

    if (!input.files.length) {
        return;
    }

    selectedFile = input.files[0];

    document.getElementById("fileName")
        .textContent =
            "📎 " + selectedFile.name;
}


/* =========================
   ADD MESSAGE
========================= */

function addMessage(text, type = "ai") {

    const welcome =
        document.getElementById("welcome");

    if (welcome) {
        welcome.remove();
    }

    const messages =
        document.getElementById("messages");

    const div =
        document.createElement("div");

    div.className =
        "message " +
        (type === "user"
            ? "user-message"
            : "ai-message");

    div.textContent = text;

    messages.appendChild(div);

    messages.scrollTop =
        messages.scrollHeight;
}


/* =========================
   ADD IMAGE
========================= */

function addImage(image, label = "Generated image") {

    const welcome =
        document.getElementById("welcome");

    if (welcome) {
        welcome.remove();
    }

    const messages =
        document.getElementById("messages");

    const div =
        document.createElement("div");

    div.className =
        "message ai-message media-message";

    const title =
        document.createElement("div");

    title.textContent = "🖼️ " + label;

    div.appendChild(title);

    const img =
        document.createElement("img");

    img.src = image;
    img.alt = label;

    div.appendChild(img);

    messages.appendChild(div);

    messages.scrollTop =
        messages.scrollHeight;
}


/* =========================
   ADD VIDEO
========================= */

function addVideo(video, label = "Generated video") {

    const welcome =
        document.getElementById("welcome");

    if (welcome) {
        welcome.remove();
    }

    const messages =
        document.getElementById("messages");

    const div =
        document.createElement("div");

    div.className =
        "message ai-message media-message";

    const title =
        document.createElement("div");

    title.textContent = "🎬 " + label;

    div.appendChild(title);

    const videoElement =
        document.createElement("video");

    videoElement.src = video;
    videoElement.controls = true;
    videoElement.autoplay = false;
    videoElement.playsInline = true;

    div.appendChild(videoElement);

    messages.appendChild(div);

    messages.scrollTop =
        messages.scrollHeight;
}


/* =========================
   LOADING
========================= */

function showLoading() {

    const welcome =
        document.getElementById("welcome");

    if (welcome) {
        welcome.remove();
    }

    const messages =
        document.getElementById("messages");

    const div =
        document.createElement("div");

    div.id = "loadingMessage";
    div.className = "message ai-message";

    div.innerHTML = `
        <div class="loading">
            <span></span>
            <span></span>
            <span></span>
        </div>
    `;

    messages.appendChild(div);

    messages.scrollTop =
        messages.scrollHeight;
}


function removeLoading() {

    const loading =
        document.getElementById(
            "loadingMessage"
        );

    if (loading) {
        loading.remove();
    }
}


/* =========================
   SEND MESSAGE
========================= */

async function sendMessage() {

    const input =
        document.getElementById(
            "messageInput"
        );

    const text =
        input.value.trim();

    if (!text && !selectedFile) {
        return;
    }

    if (text) {
        addMessage(text, "user");
    }

    input.value = "";

    showLoading();

    try {

        /* =========================
           CHAT
        ========================= */

        if (currentMode === "chat") {

            const response =
                await fetch(
                    "/chat",
                    {
                        method: "POST",

                        headers: {
                            "Content-Type":
                                "application/json"
                        },

                        body: JSON.stringify({
                            message: text
                        })
                    }
                );

            const data =
                await response.json();

            removeLoading();

            /*
             * IMPORTANT FIX:
             * Backend returns:
             * {"response":"425"}
             */

            addMessage(
                data.response ||
                data.reply ||
                data.error ||
                "Something went wrong."
            );

            return;
        }


        /* =========================
           IMAGE
        ========================= */

        if (currentMode === "image") {

            const response =
                await fetch(
                    "/generate-image",
                    {
                        method: "POST",

                        headers: {
                            "Content-Type":
                                "application/json"
                        },

                        body: JSON.stringify({
                            prompt: text
                        })
                    }
                );

            const data =
                await response.json();

            removeLoading();

            if (data.image) {

                addImage(
                    data.image,
                    "Generated image"
                );

            } else {

                addMessage(
                    data.error ||
                    "Image generation failed."
                );
            }

            return;
        }


        /* =========================
           EDIT PHOTO
        ========================= */

        if (currentMode === "edit") {

            if (!selectedFile) {

                removeLoading();

                addMessage(
                    "📷 Please upload a photo first."
                );

                return;
            }

            const formData =
                new FormData();

            formData.append(
                "image",
                selectedFile
            );

            formData.append(
                "prompt",
                text
            );

            const response =
                await fetch(
                    "/edit-image",
                    {
                        method: "POST",
                        body: formData
                    }
                );

            const data =
                await response.json();

            removeLoading();

            if (data.image) {

                addImage(
                    data.image,
                    "Edited photo"
                );

            } else {

                addMessage(
                    data.error ||
                    "Photo editing failed."
                );
            }

            return;
        }


        /* =========================
           VIDEO
        ========================= */

        if (currentMode === "video") {

            const response =
                await fetch(
                    "/generate-video",
                    {
                        method: "POST",

                        headers: {
                            "Content-Type":
                                "application/json"
                        },

                        body: JSON.stringify({
                            prompt: text
                        })
                    }
                );

            const data =
                await response.json();

            removeLoading();

            if (data.video) {

                addVideo(
                    data.video,
                    "Generated video"
                );

            } else {

                addMessage(
                    data.error ||
                    "Video generation failed."
                );
            }

            return;
        }


        /* =========================
           IMAGE → VIDEO
        ========================= */

        if (currentMode === "image-video") {

            if (!selectedFile) {

                removeLoading();

                addMessage(
                    "🖼️ Please upload an image first."
                );

                return;
            }

            const formData =
                new FormData();

            formData.append(
                "image",
                selectedFile
            );

            formData.append(
                "prompt",
                text
            );

            const response =
                await fetch(
                    "/image-to-video",
                    {
                        method: "POST",
                        body: formData
                    }
                );

            const data =
                await response.json();

            removeLoading();

            if (data.video) {

                addVideo(
                    data.video,
                    "Image → Video"
                );

            } else {

                addMessage(
                    data.error ||
                    "Image-to-video failed."
                );
            }

            return;
        }

    } catch (error) {

        console.error(error);

        removeLoading();

        addMessage(
            "Something went wrong. Please try again."
        );
    }

    selectedFile = null;

    document.getElementById(
        "fileInput"
    ).value = "";

    document.getElementById(
        "fileName"
    ).textContent = "";
}


/* =========================
   ENTER KEY
========================= */

document
    .getElementById("messageInput")
    .addEventListener(
        "keydown",
        function(event) {

            if (
                event.key === "Enter" &&
                !event.shiftKey
            ) {

                event.preventDefault();

                sendMessage();
            }
        }
    );


/* =========================
   NEW CHAT
========================= */

function newChat() {

    document.getElementById(
        "messages"
    ).innerHTML = `
        <div class="welcome" id="welcome">
            <h1>What can I help you create?</h1>
            <p>
                Chat, create images, edit photos,
                generate videos, and more.
            </p>
        </div>
    `;

    selectedFile = null;

    document.getElementById(
        "fileInput"
    ).value = "";

    document.getElementById(
        "fileName"
    ).textContent = "";

    document.getElementById(
        "messageInput"
    ).value = "";

    selectMode("chat");
}


/* =========================
   VOICE
========================= */

async function startVoice() {

    /*
     * If already recording,
     * clicking the microphone stops it.
     */

    if (
        currentRecorder &&
        currentRecorder.state === "recording"
    ) {

        currentRecorder.stop();

        return;
    }


    if (!navigator.mediaDevices) {

        addMessage(
            "Voice recording isn't supported here."
        );

        return;
    }

    try {

        const stream =
            await navigator.mediaDevices
                .getUserMedia({
                    audio: true
                });

        const recorder =
            new MediaRecorder(stream);

        currentRecorder = recorder;

        const chunks = [];

        recorder.ondataavailable =
            function(event) {

                if (event.data.size > 0) {
                    chunks.push(event.data);
                }
            };


        recorder.onstop =
            async function() {

                stream
                    .getTracks()
                    .forEach(
                        track =>
                            track.stop()
                    );

                currentRecorder = null;

                const blob =
                    new Blob(
                        chunks,
                        {
                            type:
                                "audio/webm"
                        }
                    );

                const formData =
                    new FormData();

                formData.append(
                    "audio",
                    blob,
                    "voice.webm"
                );

                try {

                    addMessage(
                        "🎤 Transcribing..."
                    );

                    const response =
                        await fetch(
                            "/transcribe",
                            {
                                method: "POST",
                                body: formData
                            }
                        );

                    const data =
                        await response.json();

                    if (data.text) {

                        document
                            .getElementById(
                                "messageInput"
                            )
                            .value =
                                data.text;

                    } else {

                        addMessage(
                            data.error ||
                            "Voice transcription failed."
                        );
                    }

                } catch (error) {

                    console.error(error);

                    addMessage(
                        "Voice transcription failed."
                    );
                }
            };


        recorder.start();

        addMessage(
            "🎤 Recording... Click the microphone again to stop."
        );

    } catch (error) {

        console.error(error);

        addMessage(
            "Please allow microphone access."
        );
    }
}

</script>

</body>
</html>

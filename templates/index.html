<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>My AI</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #0b0f17;
    color: white;
    height: 100vh;
    overflow: hidden;
}

.app {
    display: flex;
    height: 100vh;
}

.sidebar {
    width: 270px;
    background: #111722;
    border-right: 1px solid #252d3a;
    display: flex;
    flex-direction: column;
    padding: 16px;
}

.logo {
    font-size: 24px;
    font-weight: bold;
    margin-bottom: 18px;
}

.new-chat {
    width: 100%;
    padding: 13px;
    border: none;
    border-radius: 10px;
    background: #6878ff;
    color: white;
    font-weight: bold;
    cursor: pointer;
    margin-bottom: 18px;
}

.new-chat:hover {
    background: #5666ed;
}

.history-title {
    color: #8993a5;
    font-size: 13px;
    margin-bottom: 8px;
}

.chat-history {
    flex: 1;
    overflow-y: auto;
}

.chat-item {
    padding: 11px;
    margin-bottom: 5px;
    border-radius: 9px;
    cursor: pointer;
    color: #dce1eb;
    font-size: 14px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

.chat-item:hover {
    background: #1c2432;
}

.chat-item.active {
    background: #202a3c;
}

.account {
    border-top: 1px solid #252d3a;
    padding-top: 14px;
    margin-top: 10px;
}

.account-email {
    font-size: 12px;
    color: #8993a5;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    margin-bottom: 9px;
}

.logout {
    width: 100%;
    padding: 9px;
    border: 1px solid #353e4e;
    border-radius: 8px;
    background: transparent;
    color: #ddd;
    cursor: pointer;
}

.logout:hover {
    background: #1d2532;
}

.main {
    flex: 1;
    display: flex;
    flex-direction: column;
    min-width: 0;
}

.topbar {
    height: 60px;
    border-bottom: 1px solid #252d3a;
    display: flex;
    align-items: center;
    padding: 0 20px;
    font-weight: bold;
}

.messages {
    flex: 1;
    overflow-y: auto;
    padding: 25px;
}

.welcome {
    max-width: 750px;
    margin: 60px auto;
    text-align: center;
}

.welcome h1 {
    font-size: 38px;
    margin-bottom: 10px;
}

.welcome p {
    color: #8e98aa;
}

.message {
    max-width: 850px;
    margin: 0 auto 18px auto;
    display: flex;
}

.message.user {
    justify-content: flex-end;
}

.message-content {
    padding: 12px 15px;
    border-radius: 15px;
    white-space: pre-wrap;
    line-height: 1.5;
    max-width: 80%;
}

.message.user .message-content {
    background: #6878ff;
}

.message.assistant .message-content {
    background: #171e2a;
    border: 1px solid #283142;
}

.media-card {
    background: #171e2a;
    border: 1px solid #283142;
    border-radius: 15px;
    padding: 12px;
    max-width: 560px;
}

.media-card img,
.media-card video {
    display: block;
    width: 100%;
    max-width: 520px;
    border-radius: 12px;
}

.media-title {
    color: #9da6b8;
    font-size: 13px;
    margin-bottom: 10px;
}

.modes {
    display: flex;
    gap: 8px;
    padding: 10px 20px;
    overflow-x: auto;
    border-top: 1px solid #252d3a;
}

.mode-button {
    border: 1px solid #30394a;
    background: #121925;
    color: #cbd2df;
    padding: 8px 12px;
    border-radius: 9px;
    cursor: pointer;
    white-space: nowrap;
}

.mode-button.active {
    background: #6878ff;
    color: white;
    border-color: #6878ff;
}

.input-area {
    padding: 14px 20px 20px;
}

.input-box {
    max-width: 900px;
    margin: auto;
    display: flex;
    gap: 8px;
    background: #121925;
    border: 1px solid #30394a;
    border-radius: 15px;
    padding: 8px;
}

#messageInput {
    flex: 1;
    border: none;
    outline: none;
    background: transparent;
    color: white;
    padding: 10px;
    font-size: 15px;
}

#messageInput::placeholder {
    color: #778194;
}

.input-button {
    width: 42px;
    height: 42px;
    border: none;
    border-radius: 10px;
    background: #202a3a;
    color: white;
    cursor: pointer;
}

.input-button:hover {
    background: #2b374a;
}

.send-button {
    background: #6878ff;
}

.send-button:hover {
    background: #5666ed;
}

.file-area {
    max-width: 900px;
    margin: 0 auto 8px auto;
    display: none;
}

.file-area.visible {
    display: block;
}

.file-area input {
    width: 100%;
    padding: 10px;
    border: 1px solid #30394a;
    border-radius: 10px;
    background: #121925;
    color: #9da6b8;
}

.loading {
    max-width: 850px;
    margin: 0 auto 18px auto;
    color: #8993a5;
}

.error-box {
    color: #ff9c9c;
    background: #351b20;
    border: 1px solid #66333b;
    padding: 12px;
    border-radius: 12px;
    max-width: 560px;
    white-space: pre-wrap;
}

.mobile-menu-button { display:none; width:42px; height:42px; border:0; border-radius:10px; background:#202a3a; color:white; font-size:22px; cursor:pointer; }
.sidebar-overlay { display:none; }
@media (max-width:700px) {
    .app,.main { width:100%; max-width:100vw; min-width:0; overflow:hidden; }
    .mobile-menu-button { display:block; flex-shrink:0; }
    .sidebar { position:fixed; top:0; left:0; bottom:0; z-index:1000; width:min(82vw,300px); transform:translateX(-105%); transition:transform .22s ease; box-shadow:10px 0 30px rgba(0,0,0,.35); }
    .sidebar.open { transform:translateX(0); }
    .sidebar-overlay { position:fixed; inset:0; z-index:999; background:rgba(0,0,0,.45); }
    .sidebar-overlay.visible { display:block; }
    .messages { width:100%; padding-left:12px; padding-right:12px; }
    .message-content { max-width:92%; }
    .welcome h1 { font-size:30px; }
    .input-area { padding:10px 10px 12px; }
    .input-box { width:100%; max-width:none; }
}

</style>
</head>

<body>

<div class="app">

    <div id="sidebarOverlay" class="sidebar-overlay" onclick="closeSidebar()"></div>

    <aside class="sidebar">

        <div class="logo">
            🤖 My AI
        </div>

        <button
            class="new-chat"
            onclick="newChat()"
        >
            ＋ New Chat
        </button>

        <div class="history-title">
            Your Chats
        </div>

        <div
            id="chatHistory"
            class="chat-history"
        ></div>

        <div class="account">

            <div
                id="accountEmail"
                class="account-email"
            >
                Loading...
            </div>

            <button
                class="logout"
                onclick="logout()"
            >
                Log Out
            </button>

        </div>

    </aside>

    <main class="main">

        <div class="topbar">
            <button class="mobile-menu-button" onclick="toggleSidebar()" aria-label="Open chat menu">☰</button>
            🤖 My AI
        </div>

        <section
            id="messages"
            class="messages"
        >

            <div
                id="welcome"
                class="welcome"
            >

                <h1>
                    How can I help?
                </h1>

                <p>
                    Ask me anything.
                </p>

            </div>

        </section>

        <div class="modes">

            <button
                class="mode-button active"
                onclick="selectMode('chat', this)"
            >
                💬 Chat
            </button>

            <button
                class="mode-button"
                onclick="selectMode('image', this)"
            >
                🎨 Generate Image
            </button>

            <button
                class="mode-button"
                onclick="selectMode('edit', this)"
            >
                🖼️ Edit Photo
            </button>

            <button
                class="mode-button"
                onclick="selectMode('video', this)"
            >
                🎬 Generate Video
            </button>

            <button
                class="mode-button"
                onclick="selectMode('image-video', this)"
            >
                🎞️ Image → Video
            </button>

        </div>

        <div
            id="fileArea"
            class="file-area"
        >

            <input
                id="fileInput"
                type="file"
                accept="image/*"
                onchange="fileSelected()"
            >

        </div>

        <div class="input-area">

            <div class="input-box">

                <input
                    id="messageInput"
                    type="text"
                    placeholder="Message My AI..."
                    autocomplete="off"
                >

                <button
                    class="input-button"
                    onclick="startVoice()"
                    title="Voice"
                >
                    🎤
                </button>

                <button
                    class="input-button send-button"
                    onclick="sendMessage()"
                    title="Send"
                >
                    ➤
                </button>

            </div>

        </div>

    </main>

</div>


<script>

let currentMode = "chat";
let currentConversationId = null;


/* =========================
   USER
========================= */

async function loadUser() {

    try {

        const response = await fetch("/api/me");

        if (response.status === 401) {
            window.location.href = "/";
            return;
        }

        const data = await response.json();

        if (!data.logged_in) {
            window.location.href = "/";
            return;
        }

        document.getElementById(
            "accountEmail"
        ).textContent = data.email;

    } catch (error) {

        console.error(
            "User loading error:",
            error
        );
    }
}


/* =========================
   CHAT HISTORY
========================= */

async function loadChatHistory() {

    try {

        const response =
            await fetch("/api/conversations");

        if (!response.ok) {
            return;
        }

        const data =
            await response.json();

        const container =
            document.getElementById(
                "chatHistory"
            );

        container.innerHTML = "";

        data.conversations.forEach(
            conversation => {

                const item =
                    document.createElement(
                        "div"
                    );

                item.className =
                    "chat-item";

                if (
                    conversation.id ===
                    currentConversationId
                ) {

                    item.classList.add(
                        "active"
                    );
                }

                item.textContent =
                    conversation.title ||
                    "New Chat";

                item.onclick = () => {

                    loadConversation(
                        conversation.id
                    );

                };

                container.appendChild(item);

            }
        );

    } catch (error) {

        console.error(
            "Chat history error:",
            error
        );
    }
}


/* =========================
   CONVERSATION
========================= */

async function loadConversation(
    conversationId
) {

    try {

        const response =
            await fetch(
                `/api/conversations/${conversationId}`
            );

        const data =
            await response.json();

        if (!response.ok) {

            alert(
                data.error ||
                "Could not load chat."
            );

            return;
        }

        currentConversationId =
            conversationId;

        const messages =
            document.getElementById(
                "messages"
            );

        messages.innerHTML = "";

        data.messages.forEach(
            message => {

                addMessage(
                    message.content,
                    message.role
                );

            }
        );

        if (
            data.messages.length === 0
        ) {

            showWelcome();
        }

        await loadChatHistory();
        closeSidebar();

    } catch (error) {

        console.error(
            "Conversation loading error:",
            error
        );
    }
}


/* =========================
   WELCOME
========================= */

function showWelcome() {

    const messages =
        document.getElementById(
            "messages"
        );

    messages.innerHTML = `
        <div id="welcome" class="welcome">
            <h1>How can I help?</h1>
            <p>Ask me anything.</p>
        </div>
    `;
}


/* =========================
   TEXT MESSAGE
========================= */

function addMessage(
    text,
    role = "assistant"
) {

    const welcome =
        document.getElementById(
            "welcome"
        );

    if (welcome) {
        welcome.remove();
    }

    const messages =
        document.getElementById(
            "messages"
        );

    const wrapper =
        document.createElement(
            "div"
        );

    wrapper.className =
        `message ${role}`;

    const content =
        document.createElement(
            "div"
        );

    content.className =
        "message-content";

    content.textContent =
        text;

    wrapper.appendChild(
        content
    );

    messages.appendChild(
        wrapper
    );

    messages.scrollTop =
        messages.scrollHeight;
}


/* =========================
   ERROR
========================= */

function addError(
    text
) {

    const welcome =
        document.getElementById(
            "welcome"
        );

    if (welcome) {
        welcome.remove();
    }

    const messages =
        document.getElementById(
            "messages"
        );

    const wrapper =
        document.createElement(
            "div"
        );

    wrapper.className =
        "message assistant";

    const error =
        document.createElement(
            "div"
        );

    error.className =
        "error-box";

    error.textContent =
        text;

    wrapper.appendChild(
        error
    );

    messages.appendChild(
        wrapper
    );

    messages.scrollTop =
        messages.scrollHeight;
}


/* =========================
   LOADING
========================= */

function showLoading(
    text = "My AI is working..."
) {

    const messages =
        document.getElementById(
            "messages"
        );

    const loading =
        document.createElement(
            "div"
        );

    loading.id =
        "loading";

    loading.className =
        "loading";

    loading.textContent =
        text;

    messages.appendChild(
        loading
    );

    messages.scrollTop =
        messages.scrollHeight;
}


function removeLoading() {

    const loading =
        document.getElementById(
            "loading"
        );

    if (loading) {
        loading.remove();
    }
}


/* =========================
   RESPONSE ERROR
========================= */

async function getResponseData(
    response
) {

    try {

        return await response.json();

    } catch {

        return {
            error:
                `Server returned HTTP ${response.status}.`
        };

    }
}


/* =========================
   SEND
========================= */

async function sendMessage() {

    const input =
        document.getElementById(
            "messageInput"
        );

    const text =
        input.value.trim();

    if (!text) {
        return;
    }

    input.value = "";

    addMessage(
        text,
        "user"
    );

    showLoading(
        currentMode === "chat"
            ? "My AI is thinking..."
            : "My AI is creating..."
    );

    try {

        /* =====================
           CHAT
        ===================== */

        if (currentMode === "chat") {

            const response =
                await fetch(
                    "/chat",
                    {
                        method: "POST",
                        headers: {
                            "Content-Type":
                                "application/json"
                        },
                        body:
                            JSON.stringify({
                                message: text,
                                conversation_id: currentConversationId
                            })
                    }
                );

            const data =
                await getResponseData(
                    response
                );

            removeLoading();

            if (response.status === 401) {

                window.location.href = "/";
                return;
            }

            if (!response.ok) {

                addError(
                    data.error ||
                    data.reply ||
                    "Chat request failed."
                );

                return;
            }

            if (data.conversation_id) {
                currentConversationId = data.conversation_id;
            }

            addMessage(
                data.response ||
                data.reply ||
                data.error ||
                "Something went wrong.",
                "assistant"
            );

            await loadChatHistory();

            return;
        }


        /* =====================
           IMAGE
        ===================== */

        if (currentMode === "image") {

            const response =
                await fetch(
                    "/generate-image",
                    {
                        method: "POST",
                        headers: {
                            "Content-Type":
                                "application/json"
                        },
                        body:
                            JSON.stringify({
                                prompt: text
                            })
                    }
                );

            const data =
                await getResponseData(
                    response
                );

            removeLoading();

            if (!response.ok) {

                addError(
                    data.error ||
                    "Image generation failed."
                );

                return;
            }

            if (!data.image) {

                addError(
                    "The server did not return an image."
                );

                return;
            }

            addImage(
                data.image
            );

            return;
        }


        /* =====================
           EDIT PHOTO
        ===================== */

        if (currentMode === "edit") {

            const file =
                document.getElementById(
                    "fileInput"
                ).files[0];

            if (!file) {

                removeLoading();

                addError(
                    "Please choose a photo first."
                );

                return;
            }

            const formData =
                new FormData();

            formData.append(
                "image",
                file
            );

            formData.append(
                "prompt",
                text
            );

            const response =
                await fetch(
                    "/edit-image",
                    {
                        method: "POST",
                        body: formData
                    }
                );

            const data =
                await getResponseData(
                    response
                );

            removeLoading();

            if (!response.ok) {

                addError(
                    data.error ||
                    "Photo editing failed."
                );

                return;
            }

            if (!data.image) {

                addError(
                    "The server did not return an edited image."
                );

                return;
            }

            addImage(
                data.image,
                "Edited Photo"
            );

            return;
        }


        /* =====================
           VIDEO
        ===================== */

        if (currentMode === "video") {

            const response =
                await fetch(
                    "/generate-video",
                    {
                        method: "POST",
                        headers: {
                            "Content-Type":
                                "application/json"
                        },
                        body:
                            JSON.stringify({
                                prompt: text
                            })
                    }
                );

            const data =
                await getResponseData(
                    response
                );

            removeLoading();

            if (!response.ok) {

                addError(
                    data.error ||
                    "Video generation failed."
                );

                return;
            }

            if (!data.video) {

                addError(
                    "The server did not return a video."
                );

                return;
            }

            addVideo(
                data.video
            );

            return;
        }


        /* =====================
           IMAGE → VIDEO
        ===================== */

        if (
            currentMode ===
            "image-video"
        ) {

            const file =
                document.getElementById(
                    "fileInput"
                ).files[0];

            if (!file) {

                removeLoading();

                addError(
                    "Please choose an image first."
                );

                return;
            }

            const formData =
                new FormData();

            formData.append(
                "image",
                file
            );

            formData.append(
                "prompt",
                text
            );

            const response =
                await fetch(
                    "/image-to-video",
                    {
                        method: "POST",
                        body: formData
                    }
                );

            const data =
                await getResponseData(
                    response
                );

            removeLoading();

            if (!response.ok) {

                addError(
                    data.error ||
                    "Image-to-video failed."
                );

                return;
            }

            if (!data.video) {

                addError(
                    "The server did not return a video."
                );

                return;
            }

            addVideo(
                data.video
            );

            return;
        }

    } catch (error) {

        removeLoading();

        console.error(
            "Send error:",
            error
        );

        addError(
            "Connection error: " +
            error.message
        );
    }
}


/* =========================
   MOBILE SIDEBAR
========================= */
function toggleSidebar() {
    const sidebar=document.querySelector(".sidebar");
    const overlay=document.getElementById("sidebarOverlay");
    sidebar.classList.toggle("open");
    overlay.classList.toggle("visible",sidebar.classList.contains("open"));
}
function closeSidebar() {
    const sidebar=document.querySelector(".sidebar");
    const overlay=document.getElementById("sidebarOverlay");
    if (sidebar) sidebar.classList.remove("open");
    if (overlay) overlay.classList.remove("visible");
}

/* =========================
   NEW CHAT
========================= */

async function newChat() {

    try {

        const response =
            await fetch(
                "/api/conversations",
                {
                    method: "POST",
                    headers: {
                        "Content-Type":
                            "application/json"
                    },
                    body:
                        JSON.stringify({
                            title: "New Chat"
                        })
                }
            );

        const data =
            await response.json();

        if (!response.ok) {

            alert(
                data.error ||
                "Could not create a new chat."
            );

            return;
        }

        currentConversationId =
            data.conversation_id;

        showWelcome();

        await loadChatHistory();
        closeSidebar();

    } catch (error) {

        console.error(
            "New chat error:",
            error
        );
    }
}


/* =========================
   MODE
========================= */

function selectMode(
    mode,
    button
) {

    currentMode = mode;

    document
        .querySelectorAll(
            ".mode-button"
        )
        .forEach(
            item =>
                item.classList.remove(
                    "active"
                )
        );

    button.classList.add(
        "active"
    );

    const fileArea =
        document.getElementById(
            "fileArea"
        );

    const input =
        document.getElementById(
            "messageInput"
        );

    const fileInput =
        document.getElementById(
            "fileInput"
        );

    if (
        mode === "edit" ||
        mode === "image-video"
    ) {

        fileArea.classList.add(
            "visible"
        );

        fileInput.value = "";

        input.placeholder =
            mode === "edit"
                ? "Describe how to edit the photo..."
                : "Describe how the image should move...";

    } else {

        fileArea.classList.remove(
            "visible"
        );

        fileInput.value = "";

        if (mode === "image") {

            input.placeholder =
                "Describe the image you want...";

        } else if (mode === "video") {

            input.placeholder =
                "Describe the video you want...";

        } else {

            input.placeholder =
                "Message My AI...";
        }
    }
}


/* =========================
   FILE
========================= */

function fileSelected() {

    const file =
        document.getElementById(
            "fileInput"
        ).files[0];

    if (file) {

        console.log(
            "Selected image:",
            file.name
        );
    }
}


/* =========================
   IMAGE
========================= */

function addImage(
    imageUrl,
    title = "Generated Image"
) {

    const welcome =
        document.getElementById(
            "welcome"
        );

    if (welcome) {
        welcome.remove();
    }

    const messages =
        document.getElementById(
            "messages"
        );

    const wrapper =
        document.createElement(
            "div"
        );

    wrapper.className =
        "message assistant";

    const card =
        document.createElement(
            "div"
        );

    card.className =
        "media-card";

    const label =
        document.createElement(
            "div"
        );

    label.className =
        "media-title";

    label.textContent =
        title;

    const img =
        document.createElement(
            "img"
        );

    img.src =
        imageUrl;

    img.alt =
        title;

    card.appendChild(
        label
    );

    card.appendChild(
        img
    );

    wrapper.appendChild(
        card
    );

    messages.appendChild(
        wrapper
    );

    messages.scrollTop =
        messages.scrollHeight;
}


/* =========================
   VIDEO
========================= */

function addVideo(
    videoUrl
) {

    const welcome =
        document.getElementById(
            "welcome"
        );

    if (welcome) {
        welcome.remove();
    }

    const messages =
        document.getElementById(
            "messages"
        );

    const wrapper =
        document.createElement(
            "div"
        );

    wrapper.className =
        "message assistant";

    const card =
        document.createElement(
            "div"
        );

    card.className =
        "media-card";

    const label =
        document.createElement(
            "div"
        );

    label.className =
        "media-title";

    label.textContent =
        "Generated Video";

    const video =
        document.createElement(
            "video"
        );

    video.src =
        videoUrl;

    video.controls =
        true;

    video.autoplay =
        false;

    video.playsInline =
        true;

    card.appendChild(
        label
    );

    card.appendChild(
        video
    );

    wrapper.appendChild(
        card
    );

    messages.appendChild(
        wrapper
    );

    messages.scrollTop =
        messages.scrollHeight;
}


/* =========================
   VOICE
========================= */

async function startVoice() {

    if (
        !navigator.mediaDevices ||
        !navigator.mediaDevices.getUserMedia
    ) {

        alert(
            "Voice recording is not supported in this browser."
        );

        return;
    }

    try {

        const stream =
            await navigator.mediaDevices
            .getUserMedia({
                audio: true
            });

        const recorder =
            new MediaRecorder(
                stream
            );

        const chunks = [];

        recorder.ondataavailable =
            event => {

                if (
                    event.data.size > 0
                ) {

                    chunks.push(
                        event.data
                    );
                }
            };

        recorder.onstop =
            async () => {

                stream
                    .getTracks()
                    .forEach(
                        track =>
                            track.stop()
                    );

                const blob =
                    new Blob(
                        chunks,
                        {
                            type:
                                "audio/webm"
                        }
                    );

                const formData =
                    new FormData();

                formData.append(
                    "audio",
                    blob,
                    "recording.webm"
                );

                try {

                    const response =
                        await fetch(
                            "/transcribe",
                            {
                                method:
                                    "POST",
                                body:
                                    formData
                            }
                        );

                    const data =
                        await response.json();

                    if (
                        response.status ===
                        401
                    ) {

                        window.location.href =
                            "/";

                        return;
                    }

                    if (data.text) {

                        document
                            .getElementById(
                                "messageInput"
                            )
                            .value =
                            data.text;

                    } else {

                        alert(
                            data.error ||
                            "Voice transcription failed."
                        );
                    }

                } catch (error) {

                    alert(
                        "Voice transcription failed."
                    );
                }
            };

        recorder.start();

        alert(
            "Recording... Click OK when finished."
        );

        recorder.stop();

    } catch (error) {

        alert(
            "Microphone permission was not granted."
        );
    }
}

<!DOCTYPE html>
<html>
<head>
    <title>My AI</title>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #ffffff;
            color: #202123;
        }

        .header {
            height: 60px;
            display: flex;
            align-items: center;
            padding: 0 20px;
            border-bottom: 1px solid #e5e5e5;
            font-size: 20px;
            font-weight: bold;
        }

        .chat {
            height: calc(100vh - 130px);
            overflow-y: auto;
            padding: 30px 20px 100px;
        }

        .message {
            max-width: 800px;
            margin: 0 auto 25px;
            padding: 16px 20px;
            border-radius: 12px;
            line-height: 1.6;
            white-space: pre-wrap;
        }

        .user {
            background: #f0f0f0;
        }

        .ai {
            background: #ffffff;
        }

        .input-area {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            padding: 15px 20px;
            background: rgba(255, 255, 255, 0.95);
            border-top: 1px solid #e5e5e5;
        }

        .input-box {
            max-width: 800px;
            margin: auto;
            display: flex;
            gap: 10px;
        }

        input {
            flex: 1;
            padding: 15px;
            border: 1px solid #ccc;
            border-radius: 12px;
            font-size: 16px;
            outline: none;
        }

        input:focus {
            border-color: #888;
        }

        button {
            padding: 15px 22px;
            border: none;
            border-radius: 12px;
            background: #202123;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            opacity: 0.85;
        }

        .typing {
            color: #777;
            font-style: italic;
        }

        @media (max-width: 600px) {
            .header {
                font-size: 18px;
            }

            .chat {
                padding: 20px 10px 100px;
            }

            .message {
                padding: 13px 15px;
            }

            .input-area {
                padding: 10px;
            }

            button {
                padding: 14px 18px;
            }
        }
    </style>
</head>

<body>

    <div class="header">
        My AI
    </div>

    <div class="chat" id="chat">

        <div class="message ai">
            Hello! I'm My AI. How can I help you?
        </div>

    </div>

    <div class="input-area">

        <div class="input-box">

            <input
                id="message"
                type="text"
                placeholder="Message My AI..."
                autocomplete="off"
            >

            <button onclick="sendMessage()">
                Send
            </button>

        </div>

    </div>

    <script>

        const input = document.getElementById("message");

        input.addEventListener("keydown", function(event) {

            if (event.key === "Enter") {
                event.preventDefault();
                sendMessage();
            }

        });


        async function sendMessage() {

            const message = input.value.trim();

            if (!message) {
                return;
            }

            const chat = document.getElementById("chat");

            chat.innerHTML += `
                <div class="message user">${escapeHtml(message)}</div>
            `;

            input.value = "";

            input.focus();

            chat.scrollTop = chat.scrollHeight;


            const thinking = document.createElement("div");

            thinking.className = "message ai typing";

            thinking.textContent = "My AI is thinking...";

            chat.appendChild(thinking);

            chat.scrollTop = chat.scrollHeight;


            try {

                const response = await fetch("/chat", {

                    method: "POST",

                    headers: {
                        "Content-Type": "application/json"
                    },

                    body: JSON.stringify({
                        message: message
                    })

                });


                const data = await response.json();

                thinking.remove();


                const aiMessage = document.createElement("div");

                aiMessage.className = "message ai";

                aiMessage.textContent = data.reply;

                chat.appendChild(aiMessage);


            } catch (error) {

                thinking.textContent =
                    "Sorry, I couldn't connect to My AI.";

            }


            chat.scrollTop = chat.scrollHeight;

            input.focus();

        }


        function escapeHtml(text) {

            const div = document.createElement("div");

            div.textContent = text;

            return div.innerHTML;

        }

    </script>

</body>
</html>

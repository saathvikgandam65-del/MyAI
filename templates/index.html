<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>My AI</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #0b0f17;
    color: white;
    height: 100vh;
    overflow: hidden;
}

/* =========================
   LAYOUT
========================= */

.app {
    display: flex;
    height: 100vh;
}

/* =========================
   SIDEBAR
========================= */

.sidebar {
    width: 270px;
    background: #111722;
    border-right: 1px solid #252d3a;
    display: flex;
    flex-direction: column;
    padding: 16px;
}

.logo {
    font-size: 24px;
    font-weight: bold;
    margin-bottom: 18px;
}

.new-chat {
    width: 100%;
    padding: 13px;
    border: none;
    border-radius: 10px;
    background: #6878ff;
    color: white;
    font-weight: bold;
    cursor: pointer;
    margin-bottom: 18px;
}

.new-chat:hover {
    background: #5666ed;
}

.history-title {
    color: #8993a5;
    font-size: 13px;
    margin-bottom: 8px;
}

.chat-history {
    flex: 1;
    overflow-y: auto;
}

.chat-item {
    padding: 11px;
    margin-bottom: 5px;
    border-radius: 9px;
    cursor: pointer;
    color: #dce1eb;
    font-size: 14px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

.chat-item:hover {
    background: #1c2432;
}

.chat-item.active {
    background: #202a3c;
}

.account {
    border-top: 1px solid #252d3a;
    padding-top: 14px;
    margin-top: 10px;
}

.account-email {
    font-size: 12px;
    color: #8993a5;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    margin-bottom: 9px;
}

.logout {
    width: 100%;
    padding: 9px;
    border: 1px solid #353e4e;
    border-radius: 8px;
    background: transparent;
    color: #ddd;
    cursor: pointer;
}

.logout:hover {
    background: #1d2532;
}

/* =========================
   MAIN
========================= */

.main {
    flex: 1;
    display: flex;
    flex-direction: column;
    min-width: 0;
}

.topbar {
    height: 60px;
    border-bottom: 1px solid #252d3a;
    display: flex;
    align-items: center;
    padding: 0 20px;
    font-weight: bold;
}

.messages {
    flex: 1;
    overflow-y: auto;
    padding: 25px;
}

.welcome {
    max-width: 750px;
    margin: 60px auto;
    text-align: center;
}

.welcome h1 {
    font-size: 38px;
    margin-bottom: 10px;
}

.welcome p {
    color: #8e98aa;
}

/* =========================
   MESSAGES
========================= */

.message {
    max-width: 850px;
    margin: 0 auto 18px auto;
    display: flex;
}

.message.user {
    justify-content: flex-end;
}

.message-content {
    padding: 12px 15px;
    border-radius: 15px;
    white-space: pre-wrap;
    line-height: 1.5;
    max-width: 80%;
}

.message.user .message-content {
    background: #6878ff;
}

.message.assistant .message-content {
    background: #171e2a;
    border: 1px solid #283142;
}

/* =========================
   MODES
========================= */

.modes {
    display: flex;
    gap: 8px;
    padding: 10px 20px;
    overflow-x: auto;
    border-top: 1px solid #252d3a;
}

.mode-button {
    border: 1px solid #30394a;
    background: #121925;
    color: #cbd2df;
    padding: 8px 12px;
    border-radius: 9px;
    cursor: pointer;
    white-space: nowrap;
}

.mode-button.active {
    background: #6878ff;
    color: white;
    border-color: #6878ff;
}

/* =========================
   INPUT
========================= */

.input-area {
    padding: 14px 20px 20px;
}

.input-box {
    max-width: 900px;
    margin: auto;
    display: flex;
    gap: 8px;
    background: #121925;
    border: 1px solid #30394a;
    border-radius: 15px;
    padding: 8px;
}

#messageInput {
    flex: 1;
    border: none;
    outline: none;
    background: transparent;
    color: white;
    padding: 10px;
    font-size: 15px;
}

#messageInput::placeholder {
    color: #778194;
}

.input-button {
    width: 42px;
    height: 42px;
    border: none;
    border-radius: 10px;
    background: #202a3a;
    color: white;
    cursor: pointer;
}

.input-button:hover {
    background: #2b374a;
}

.send-button {
    background: #6878ff;
}

.send-button:hover {
    background: #5666ed;
}

/* =========================
   FILE
========================= */

.file-area {
    max-width: 900px;
    margin: 0 auto 8px auto;
}

.file-area input {
    color: #9da6b8;
}

/* =========================
   LOADING
========================= */

.loading {
    max-width: 850px;
    margin: 0 auto 18px auto;
    color: #8993a5;
}

/* =========================
   MOBILE
========================= */

@media (max-width: 700px) {

    .sidebar {
        width: 220px;
    }

    .welcome h1 {
        font-size: 30px;
    }

    .message-content {
        max-width: 90%;
    }
}

</style>
</head>

<body>

<div class="app">

    <!-- =========================
         SIDEBAR
    ========================= -->

    <aside class="sidebar">

        <div class="logo">
            🤖 My AI
        </div>

        <button
            class="new-chat"
            onclick="newChat()"
        >
            ＋ New Chat
        </button>

        <div class="history-title">
            Your Chats
        </div>

        <div
            id="chatHistory"
            class="chat-history"
        ></div>

        <div class="account">

            <div
                id="accountEmail"
                class="account-email"
            >
                Loading...
            </div>

            <button
                class="logout"
                onclick="logout()"
            >
                Log Out
            </button>

        </div>

    </aside>


    <!-- =========================
         MAIN
    ========================= -->

    <main class="main">

        <div class="topbar">
            My AI
        </div>

        <section
            id="messages"
            class="messages"
        >

            <div
                id="welcome"
                class="welcome"
            >

                <h1>
                    How can I help?
                </h1>

                <p>
                    Ask me anything.
                </p>

            </div>

        </section>


        <!-- MODES -->

        <div class="modes">

            <button
                class="mode-button active"
                onclick="selectMode('chat', this)"
            >
                💬 Chat
            </button>

            <button
                class="mode-button"
                onclick="selectMode('image', this)"
            >
                🎨 Generate Image
            </button>

            <button
                class="mode-button"
                onclick="selectMode('edit', this)"
            >
                🖼️ Edit Photo
            </button>

            <button
                class="mode-button"
                onclick="selectMode('video', this)"
            >
                🎬 Generate Video
            </button>

            <button
                class="mode-button"
                onclick="selectMode('image-video', this)"
            >
                🎞️ Image → Video
            </button>

        </div>


        <!-- FILE -->

        <div class="file-area">

            <input
                id="fileInput"
                type="file"
                onchange="fileSelected()"
            >

        </div>


        <!-- INPUT -->

        <div class="input-area">

            <div class="input-box">

                <input
                    id="messageInput"
                    type="text"
                    placeholder="Message My AI..."
                    autocomplete="off"
                >

                <button
                    class="input-button"
                    onclick="startVoice()"
                    title="Voice"
                >
                    🎤
                </button>

                <button
                    class="input-button send-button"
                    onclick="sendMessage()"
                    title="Send"
                >
                    ➤
                </button>

            </div>

        </div>

    </main>

</div>


<script>

let currentMode = "chat";
let currentConversationId = null;


/* =========================
   LOAD USER
========================= */

async function loadUser() {

    try {

        const response = await fetch(
            "/api/me"
        );

        const data =
            await response.json();

        if (!data.logged_in) {

            window.location.href = "/";
            return;
        }

        document.getElementById(
            "accountEmail"
        ).textContent = data.email;

    } catch (error) {

        console.error(
            "User loading error:",
            error
        );
    }
}


/* =========================
   LOAD CHAT LIST
========================= */

async function loadChatHistory() {

    try {

        const response = await fetch(
            "/api/conversations"
        );

        if (!response.ok) {
            return;
        }

        const data =
            await response.json();

        const container =
            document.getElementById(
                "chatHistory"
            );

        container.innerHTML = "";

        data.conversations.forEach(
            conversation => {

                const item =
                    document.createElement(
                        "div"
                    );

                item.className =
                    "chat-item";

                if (
                    conversation.id ===
                    currentConversationId
                ) {
                    item.classList.add(
                        "active"
                    );
                }

                item.textContent =
                    conversation.title ||
                    "New Chat";

                item.onclick = () => {

                    loadConversation(
                        conversation.id
                    );

                };

                container.appendChild(item);
            }
        );

    } catch (error) {

        console.error(
            "Chat history error:",
            error
        );
    }
}


/* =========================
   LOAD CONVERSATION
========================= */

async function loadConversation(
    conversationId
) {

    try {

        const response = await fetch(
            `/api/conversations/${conversationId}`
        );

        const data =
            await response.json();

        if (!response.ok) {

            alert(
                data.error ||
                "Could not load chat."
            );

            return;
        }

        currentConversationId =
            conversationId;

        const messages =
            document.getElementById(
                "messages"
            );

        messages.innerHTML = "";

        data.messages.forEach(
            message => {

                addMessage(
                    message.content,
                    message.role
                );

            }
        );

        if (
            data.messages.length === 0
        ) {
            showWelcome();
        }

        await loadChatHistory();

    } catch (error) {

        console.error(
            "Conversation loading error:",
            error
        );
    }
}


/* =========================
   WELCOME
========================= */

function showWelcome() {

    const messages =
        document.getElementById(
            "messages"
        );

    messages.innerHTML = `
        <div id="welcome" class="welcome">
            <h1>How can I help?</h1>
            <p>Ask me anything.</p>
        </div>
    `;
}


/* =========================
   ADD MESSAGE
========================= */

function addMessage(
    text,
    role = "assistant"
) {

    const welcome =
        document.getElementById(
            "welcome"
        );

    if (welcome) {
        welcome.remove();
    }

    const messages =
        document.getElementById(
            "messages"
        );

    const wrapper =
        document.createElement(
            "div"
        );

    wrapper.className =
        `message ${role}`;

    const content =
        document.createElement(
            "div"
        );

    content.className =
        "message-content";

    content.textContent = text;

    wrapper.appendChild(content);

    messages.appendChild(wrapper);

    messages.scrollTop =
        messages.scrollHeight;
}


/* =========================
   LOADING
========================= */

function showLoading() {

    const messages =
        document.getElementById(
            "messages"
        );

    const loading =
        document.createElement(
            "div"
        );

    loading.id =
        "loading";

    loading.className =
        "loading";

    loading.textContent =
        "My AI is thinking...";

    messages.appendChild(loading);

    messages.scrollTop =
        messages.scrollHeight;
}


function removeLoading() {

    const loading =
        document.getElementById(
            "loading"
        );

    if (loading) {
        loading.remove();
    }
}


/* =========================
   SEND MESSAGE
========================= */

async function sendMessage() {

    const input =
        document.getElementById(
            "messageInput"
        );

    const text =
        input.value.trim();

    if (!text) {
        return;
    }

    input.value = "";

    addMessage(
        text,
        "user"
    );

    showLoading();

    try {

        if (currentMode === "chat") {

            const response =
                await fetch(
                    "/chat",
                    {
                        method: "POST",
                        headers: {
                            "Content-Type":
                                "application/json"
                        },
                        body:
                            JSON.stringify({
                                message: text
                            })
                    }
                );

            const data =
                await response.json();

            removeLoading();

            if (response.status === 401) {

                window.location.href = "/";
                return;
            }

            addMessage(
                data.response ||
                data.reply ||
                data.error ||
                "Something went wrong.",
                "assistant"
            );

            await loadChatHistory();

            return;
        }


        /* IMAGE */

        if (currentMode === "image") {

            const response =
                await fetch(
                    "/generate-image",
                    {
                        method: "POST",
                        headers: {
                            "Content-Type":
                                "application/json"
                        },
                        body:
                            JSON.stringify({
                                prompt: text
                            })
                    }
                );

            const data =
                await response.json();

            removeLoading();

            if (data.error) {

                addMessage(
                    data.error,
                    "assistant"
                );

            } else if (data.image) {

                addImage(
                    data.image
                );

            } else {

                addMessage(
                    "Image generation is not available yet.",
                    "assistant"
                );
            }

            return;
        }


        /* EDIT */

        if (currentMode === "edit") {

            const file =
                document.getElementById(
                    "fileInput"
                ).files[0];

            if (!file) {

                removeLoading();

                addMessage(
                    "Please choose a photo first.",
                    "assistant"
                );

                return;
            }

            const formData =
                new FormData();

            formData.append(
                "image",
                file
            );

            formData.append(
                "prompt",
                text
            );

            const response =
                await fetch(
                    "/edit-image",
                    {
                        method: "POST",
                        body: formData
                    }
                );

            const data =
                await response.json();

            removeLoading();

            if (data.image) {

                addImage(
                    data.image
                );

            } else {

                addMessage(
                    data.error ||
                    "Photo editing is not available yet.",
                    "assistant"
                );
            }

            return;
        }


        /* VIDEO */

        if (currentMode === "video") {

            const response =
                await fetch(
                    "/generate-video",
                    {
                        method: "POST",
                        headers: {
                            "Content-Type":
                                "application/json"
                        },
                        body:
                            JSON.stringify({
                                prompt: text
                            })
                    }
                );

            const data =
                await response.json();

            removeLoading();

            if (data.video) {

                addVideo(
                    data.video
                );

            } else {

                addMessage(
                    data.error ||
                    "Video generation is not available yet.",
                    "assistant"
                );
            }

            return;
        }


        /* IMAGE TO VIDEO */

        if (
            currentMode ===
            "image-video"
        ) {

            const file =
                document.getElementById(
                    "fileInput"
                ).files[0];

            if (!file) {

                removeLoading();

                addMessage(
                    "Please choose an image first.",
                    "assistant"
                );

                return;
            }

            const formData =
                new FormData();

            formData.append(
                "image",
                file
            );

            formData.append(
                "prompt",
                text
            );

            const response =
                await fetch(
                    "/image-to-video",
                    {
                        method: "POST",
                        body: formData
                    }
                );

            const data =
                await response.json();

            removeLoading();

            if (data.video) {

                addVideo(
                    data.video
                );

            } else {

                addMessage(
                    data.error ||
                    "Image-to-video is not available yet.",
                    "assistant"
                );
            }

        }

    } catch (error) {

        removeLoading();

        console.error(
            "Send error:",
            error
        );

        addMessage(
            "Something went wrong. Please try again.",
            "assistant"
        );
    }
}


/* =========================
   NEW CHAT
========================= */

async function newChat() {

    try {

        const response =
            await fetch(
                "/api/conversations",
                {
                    method: "POST",
                    headers: {
                        "Content-Type":
                            "application/json"
                    },
                    body:
                        JSON.stringify({
                            title: "New Chat"
                        })
                }
            );

        const data =
            await response.json();

        if (!response.ok) {

            alert(
                data.error ||
                "Could not create a new chat."
            );

            return;
        }

        currentConversationId =
            data.conversation_id;

        showWelcome();

        await loadChatHistory();

    } catch (error) {

        console.error(
            "New chat error:",
            error
        );
    }
}


/* =========================
   MODE
========================= */

function selectMode(
    mode,
    button
) {

    currentMode = mode;

    document
        .querySelectorAll(
            ".mode-button"
        )
        .forEach(
            item =>
                item.classList.remove(
                    "active"
                )
        );

    button.classList.add(
        "active"
    );
}


/* =========================
   FILE
========================= */

function fileSelected() {

    const file =
        document.getElementById(
            "fileInput"
        ).files[0];

    if (file) {

        console.log(
            "Selected:",
            file.name
        );
    }
}


/* =========================
   IMAGE
========================= */

function addImage(
    imageUrl
) {

    const welcome =
        document.getElementById(
            "welcome"
        );

    if (welcome) {
        welcome.remove();
    }

    const messages =
        document.getElementById(
            "messages"
        );

    const wrapper =
        document.createElement(
            "div"
        );

    wrapper.className =
        "message assistant";

    const img =
        document.createElement(
            "img"
        );

    img.src = imageUrl;

    img.style.maxWidth =
        "500px";

    img.style.borderRadius =
        "15px";

    wrapper.appendChild(img);

    messages.appendChild(
        wrapper
    );

    messages.scrollTop =
        messages.scrollHeight;
}


/* =========================
   VIDEO
========================= */

function addVideo(
    videoUrl
) {

    const welcome =
        document.getElementById(
            "welcome"
        );

    if (welcome) {
        welcome.remove();
    }

    const messages =
        document.getElementById(
            "messages"
        );

    const wrapper =
        document.createElement(
            "div"
        );

    wrapper.className =
        "message assistant";

    const video =
        document.createElement(
            "video"
        );

    video.src = videoUrl;

    video.controls = true;

    video.style.maxWidth =
        "500px";

    video.style.borderRadius =
        "15px";

    wrapper.appendChild(
        video
    );

    messages.appendChild(
        wrapper
    );

    messages.scrollTop =
        messages.scrollHeight;
}


/* =========================
   VOICE
========================= */

async function startVoice() {

    if (
        !navigator.mediaDevices ||
        !navigator.mediaDevices.getUserMedia
    ) {

        alert(
            "Voice recording is not supported in this browser."
        );

        return;
    }

    try {

        const stream =
            await navigator.mediaDevices
            .getUserMedia({
                audio: true
            });

        const recorder =
            new MediaRecorder(
                stream
            );

        const chunks = [];

        recorder.ondataavailable =
            event => {

                if (
                    event.data.size > 0
                ) {
                    chunks.push(
                        event.data
                    );
                }
            };

        recorder.onstop =
            async () => {

                stream
                    .getTracks()
                    .forEach(
                        track =>
                            track.stop()
                    );

                const blob =
                    new Blob(
                        chunks,
                        {
                            type:
                                "audio/webm"
                        }
                    );

                const formData =
                    new FormData();

                formData.append(
                    "audio",
                    blob,
                    "recording.webm"
                );

                try {

                    const response =
                        await fetch(
                            "/transcribe",
                            {
                                method:
                                    "POST",
                                body:
                                    formData
                            }
                        );

                    const data =
                        await response.json();

                    if (response.status === 401) {

                        window.location.href =
                            "/";

                        return;
                    }

                    if (data.text) {

                        document
                            .getElementById(
                                "messageInput"
                            )
                            .value =
                            data.text;

                    } else {

                        alert(
                            data.error ||
                            "Voice transcription failed."
                        );
                    }

                } catch (error) {

                    alert(
                        "Voice transcription failed."
                    );
                }
            };

        recorder.start();

        alert(
            "Recording... Click OK when you are finished."
        );

        recorder.stop();

    } catch (error) {

        alert(
            "Microphone permission was not granted."
        );
    }
}


/* =========================
   LOGOUT
========================= */

function logout() {

    window.location.href =
        "/logout";
}


/* =========================
   ENTER KEY
========================= */

document
    .getElementById(
        "messageInput"
    )
    .addEventListener(
        "keydown",
        event => {

            if (
                event.key === "Enter"
                &&
                !event.shiftKey
            ) {

                event.preventDefault();

                sendMessage();
            }
        }
    );


/* =========================
   START
========================= */

(async function() {

    await loadUser();

    await loadChatHistory();

})();

</script>

</body>
</html>
